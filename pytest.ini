[pytest]
python_files = test_*.py
python_classes = Test*
norecursedirs = scripts backup .tmp-browser .venv Microsoft .git ui __pycache__ vendor
; assetlib P2/P3 tests exercise the uncommitted assetlib.tools subsystem
; (env/catalog/router/run_p2_contract) — excluded until that subsystem lands
; tests/spawn_cube.py + tests/test_spawn_cube.py are manual live-editor probe
; scripts (no test functions); they must never be collected (import-time
; bridge spawns mutate the live editor outside guard coverage)
addopts = --ignore=tests/native_capture_test.py --ignore=tests/test_final.py --ignore=tests/test_simple_room.py --ignore=tests/test_room/modern_room_test.py --ignore=tests/test_umg_menu.py --ignore=tests/test_spawn_cube.py --ignore=tests/spawn_cube.py --ignore=assetlib/tests/test_p2_contract.py --ignore=assetlib/tests/test_p3_router.py --ignore=test_memory_integration.py --ignore=test_capture.py --ignore=test_pipeline.py --ignore=test_persistence_simple.py --ignore=simple_test.py --ignore=final_test.py --ignore=final_corrected_test.py --ignore=final_verification_simple.py --ignore=phase2_verification.py --ignore=test_room --ignore=tests/test_room
markers =
    live_unreal: test explicitly opts into real Unreal Editor bridge access (6766); all other tests are hermetic