<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aivido Test — Camera / Proof</title>
  <link rel="stylesheet" href="/static/product.css?v=596363ae">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="logo">◈</span>
        <div>
          <h1>Aivido Test</h1>
          <p class="subtitle">Unreal Agent · Frame an actor — get fresh proof. Frontend integration check.</p>
        </div>
      </div>
      <div class="project-cluster">
        <div class="pill" title="Backend status">
          <span class="dot" id="stateDot"></span>
          <span id="backendState">Connecting…</span>
        </div>
      </div>
    </header>

    <section class="card baseurl-card">
      <div class="field">
        <label for="baseUrl">Base URL</label>
        <div class="row">
          <input id="baseUrl" class="textinput" autocomplete="off"
            placeholder="https://shadow-6kckcfdq.tail5f3ac6.ts.net or http://100.84.156.24:8765 (empty = same origin)">
          <button id="baseUrlSave" class="btn ghost small" type="button">Save</button>
        </div>
        <div class="note" id="baseUrlNote">Empty uses the page origin. Saved in this browser.</div>
      </div>
    </section>

    <section class="card ask">
      <div class="field">
        <label for="actorName">Actor name (optional)</label>
        <input id="actorName" class="textinput" autocomplete="off"
          placeholder="e.g. Agent_Test_Cube">
      </div>
      <div class="field">
        <label for="location">Location (optional) — e.g. [0, 0, 200]</label>
        <input id="location" class="textinput" autocomplete="off"
          placeholder="[0, 0, 200]">
      </div>
      <div class="ask-row">
        <span class="hint" id="hint">Frame an actor and capture fresh proof in one call.</span>
        <span class="state-label" id="stateLabel" data-state="IDLE">IDLE</span>
        <button id="runBtn" class="btn primary big" type="button">Frame &amp; Proof</button>
      </div>
      <div class="result-detail" id="resultDetail"></div>
    </section>

    <section class="card proof-card">
      <div class="proof-head">
        <h2>Proof</h2>
        <div class="proof-actions">
          <label class="auto" title="Re-fetch the proof image every 5 s (cache-busted)">
            <input type="checkbox" id="pvAuto" checked> Auto-refresh
          </label>
          <button id="pvRefresh" class="btn ghost small" type="button">↻ Refresh Proof</button>
        </div>
      </div>
      <div class="proof-frame">
        <img id="pvProof" alt="Latest Unreal viewport proof" src="" hidden>
        <div class="proof-empty" id="pvEmpty">No proof yet — run Frame &amp; Proof or press Refresh Proof.</div>
      </div>
      <div class="proof-meta" id="pvProofMeta">—</div>
    </section>

    <footer class="foot">
      <span id="footStatus">Idle</span>
    </footer>
  </div>
  <script src="/static/product.js?v=15accd5a"></script>
</body>
</html>
