<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aivido — Ava, your living AI companion</title>
<meta name="description" content="Aivido — a living AI companion that can control Unreal Engine for you.">
<meta name="theme-color" content="#04060d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g' cx='35%' cy='30%'><stop offset='0%' stop-color='%23bdf3ff'/><stop offset='45%' stop-color='%2338bdf8'/><stop offset='100%' stop-color='%2310367c'/></radialGradient></defs><circle cx='32' cy='32' r='26' fill='url(%23g)'/><circle cx='26' cy='28' r='4' fill='%23eafcff'/><circle cx='38' cy='28' r='4' fill='%23eafcff'/><path d='M25 38 q7 5 14 0' stroke='%237dd3fc' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/static/ava.css?v=3a95fb53">
</head>
<body data-state="idle" data-mode="idle" data-voice="off" data-tc="off">

  <!-- ============ LIVING ENVIRONMENT ============ -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="env" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="fog f1"></div>
    <div class="fog f2"></div>
    <div class="horizon-glow"></div>
    <div class="grid-floor"></div>
    <div class="hud-ring r1"></div>
    <div class="hud-ring r2"></div>
    <div class="hud-ring r3"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-orb" aria-hidden="true"><i></i><i></i></div>
      <div class="brand-text">
        <strong class="wordmark">Aivido</strong>
        <span id="brandSub">Ava · living AI companion</span>
      </div>
    </div>
    <div class="top-right">
      <button id="updateChip" class="update-chip hidden" title="A newer Aivido UI is available — click to download">Update available</button>
      <button id="statusPill" class="status-pill" title="Backend status">
        <span id="statusDot" class="dot"></span><span id="statusText">Connecting…</span>
      </button>
      <button id="advancedBtn" class="btn-ghost" title="Open the developer console">Advanced</button>
    </div>
  </header>

  <!-- ============ STAGE ============ -->
  <main class="stage">

    <section class="avatar-scene" id="avatarScene">
      <div class="avatar" id="avatar" role="img" aria-label="Aivido avatar">
        <div class="aura"></div>
        <div class="ring ring-orb"></div>
        <div class="ring ring-spin"></div>

        <div class="orbit orbit-a" id="orbitA"></div>
        <div class="orbit orbit-b" id="orbitB"></div>

        <div class="think" id="think"><div class="think-ring"></div><div class="sweep"></div></div>

        <div class="wave" id="wave"></div>

        <div class="core" id="core">
          <div class="core-shine"></div>
          <div class="face" id="face">
            <div class="eye eye-l"></div>
            <div class="eye eye-r"></div>
            <div class="mouth"></div>
          </div>
        </div>

        <div class="burst" id="burst"><i></i><i></i><i></i></div>
        <div class="streams" id="streams"></div>
        <div class="specks" id="specks"></div>
      </div>

      <div class="caption">
        <span id="modeTag" class="mode-tag" aria-hidden="true"></span>
        <h1 id="captionTitle">Aivido</h1>
        <p id="statusLine">Ready. What should we build?</p>
      </div>
    </section>

    <section class="chat" id="chat" aria-live="polite">
      <div id="messages" class="messages"></div>
    </section>

  </main>

  <!-- ============ DOCK : MISSION STRIP + COMPOSER ============ -->
  <footer class="dock" id="dock">

    <div id="taskCard" class="task-card hidden" data-tc="working">
      <div class="tc-accent" aria-hidden="true"></div>
      <div class="tc-head">
        <span class="tc-icon" id="tcIcon" aria-hidden="true"></span>
        <div class="tc-titles">
          <span class="tc-title" id="tcTitle">Building your scene</span>
          <span class="tc-step" id="tcStep">Working…</span>
        </div>
        <span class="tc-pct" id="tcPct">0%</span>
        <span class="tc-badge" id="tcBadge">working</span>
      </div>
      <div class="tc-progress"><i id="tcBar"></i></div>
      <div class="tc-actions" id="tcActions">
        <button id="tcExpand" class="tc-btn">Details</button>
        <button id="tcCancel" class="tc-btn danger">Cancel</button>
        <button id="tcApprove" class="tc-btn approve hidden">Approve</button>
        <button id="tcReject" class="tc-btn danger hidden">Reject</button>
        <button id="tcDismiss" class="tc-btn hidden">Dismiss</button>
      </div>
    </div>

    <div class="composer" id="composer">
      <div id="attachChips" class="attach-chips"></div>
      <div class="composer-bar">
        <div class="composer-wave" id="composerWave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <button id="attachBtn" class="c-btn" title="Attach files" aria-label="Attach files">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Ask Aivido anything…" enterkeyhint="send" autocomplete="off"></textarea>
        <button id="micBtn" class="c-btn mic" title="Voice input" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21.5"/></svg>
        </button>
        <button id="sendBtn" class="c-send" disabled title="Send">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-2.4-6.9L3 11.5z" transform="translate(1.5 1) scale(.85)"/></svg>
        </button>
      </div>
      <div class="composer-hint">
        <span>Enter to send · Shift+Enter for a new line</span>
        <span id="speakChip" class="speak-chip"></span>
        <span id="voiceHint" class="voice-hint"></span>
      </div>
    </div>

  </footer>

  <!-- ============ LIVE EVIDENCE FRAME ============ -->
  <aside id="pip" class="pip hidden" aria-hidden="true">
    <div class="pip-head">
      <span class="pip-badge" id="pipBadge">CAPTURE</span>
      <span class="pip-label">Live viewport evidence</span>
    </div>
    <img id="pipImg" alt="Live viewport capture" draggable="false">
    <div class="pip-foot">Aivido proof · fresh capture</div>
  </aside>

  <!-- completion flash -->
  <div id="completionCard" class="completion hidden" role="status">
    <div class="completion-icon" aria-hidden="true"></div>
    <div class="completion-text"><strong id="completionTitle">Complete</strong><span id="completionMsg"></span></div>
  </div>

  <!-- ============ ADVANCED / DEVELOPER CONSOLE ============ -->
  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">
        <strong>AIVIDO · Advanced</strong>
        <span>Developer console · live backend</span>
      </div>
      <div class="drawer-actions">
        <a id="drawerOpen" href="/dev" target="_blank" rel="noopener" class="btn-ghost sm">Open ↗</a>
        <button id="drawerClose" class="btn-ghost sm" aria-label="Close advanced panel">✕</button>
      </div>
    </div>
    <iframe id="drawerFrame" src="/dev" title="Developer console — queue, changes, files, terminal, preview"></iframe>
  </aside>

  <div id="toast" role="status"></div>
  <input type="file" id="fileInput" class="hidden" multiple>

<script src="/static/ava_widget.js?v=8a45e149"></script>
<script src="/static/ava.js?v=828c0765"></script>
</body>
</html>
